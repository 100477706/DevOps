name: CI Pipeline

on:
  push:
    branches:
      - 'sprint-**'
      - develop
      - main
  pull_request:
    branches:
      - 'sprint-**'
      - develop
      - main

jobs:
  # ─────────────────────────────────────────────
  # Backend – Unit & Integration Tests
  # ─────────────────────────────────────────────
  backend-tests:
    name: "🧪 Backend Tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run linter (flake8)
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Run tests
        run: |
          if [ -f pytest.ini ] || [ -f setup.cfg ] || [ -d tests ]; then
            pip install pytest pytest-cov
            pytest --cov=. --cov-report=xml --cov-report=term-missing -v || echo "No tests found yet."
          else
            echo "No test configuration found – skipping tests."
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  # ─────────────────────────────────────────────
  # Frontend – Build & Tests
  # ─────────────────────────────────────────────
  frontend-tests:
    name: "🎨 Frontend Tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json found – skipping frontend install."
          fi

      - name: Run linter
        run: |
          if [ -f package.json ] && grep -q '"lint"' package.json; then
            npm run lint
          else
            echo "No lint script found – skipping."
          fi

      - name: Run tests
        run: |
          if [ -f package.json ] && grep -q '"test"' package.json; then
            npm test -- --watchAll=false --passWithNoTests
          else
            echo "No test script found – skipping."
          fi

      - name: Build
        run: |
          if [ -f package.json ] && grep -q '"build"' package.json; then
            npm run build
          else
            echo "No build script found – skipping."
          fi

  # ─────────────────────────────────────────────
  # Docker – Build Validation
  # ─────────────────────────────────────────────
  docker-build:
    name: "🐳 Docker Build Check"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [backend-tests, frontend-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Docker Compose config
        run: |
          if [ -f docker-compose.yaml ] || [ -f docker-compose.yml ]; then
            docker compose config --quiet
            echo "✅ docker-compose.yaml is valid."
          else
            echo "⚠️  No docker-compose.yaml found yet – skipping Docker validation."
          fi

      - name: Build Docker images (dry-run)
        run: |
          if [ -f docker-compose.yaml ] || [ -f docker-compose.yml ]; then
            docker compose build --no-cache
          else
            echo "⚠️  Skipping Docker build – no compose file found."
          fi
